name: astrbot_plugin_switch_model
display_name: 自动切换模型
desc: "文本模型调用报错（额度耗尽、限流、鉴权失效、模型下线等）时，按你配置的顺序自动切换到下一个可用模型。"
short_desc: "文本模型报错自动切换；设置按四组卡片分区，图像/文本列表均可排序"
version: 2.0.0
author: EricTangX
repo: https://github.com/EricTangX/astrbot_plugin_switch_model
astrbot_version: ">=4.0.0"
# 插件不接触任何平台适配器 API，只挂钩 Provider 层；这里列的是主要使用场景
support_platforms:
  - aiocqhttp
  - qq_official
tags:
  - 模型切换
  - 故障转移
  - fallback
  - 冷却
