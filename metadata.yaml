name: astrbot_plugin_provider_chain
display_name: 候选链 · ProviderChain
desc: "主模型报错自动接力，支持图文候选列表；解析层接管选模，有序候选 + 失败冷却 + 降权，不重启即时生效；不猜模型能力，不越出候选集；支持发图后等待补挂消息，让聊天更自由。"
short_desc: "模型自动切换 · 文本/图像双优先级 · 失败冷却降级 · 严格候选集 · 发图后补挂。"
version: 2.1.0
author: EricTangX
repo: https://github.com/EricTangX/astrbot_plugin_switch_model
astrbot_version: ">=4.0.0"
# 插件不接触任何平台适配器 API，只挂钩 Provider 层；这里列的是主要使用场景
support_platforms:
  - aiocqhttp
  - qq_official
tags:
  - 模型切换
  - 故障转移
  - fallback
  - 冷却
